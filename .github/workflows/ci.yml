name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest

    # Test-only settings. The app reads config from the environment; these are
    # dummy values so `get_settings()` validates at import time in CI.
    env:
      APP_NAME: Style Engine AI
      APP_ENV: ci
      DEBUG: "false"
      DATABASE_URL: sqlite+pysqlite:///:memory:
      REDIS_URL: redis://localhost:6379/0
      STORAGE_PROVIDER: s3
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: ci-access
      S3_SECRET_KEY: ci-secret
      S3_BUCKET: style-engine-ci
      S3_REGION: us-east-1
      S3_USE_SSL: "false"
      S3_PATH_STYLE: "true"
      INTERNAL_API_KEY: ci-internal-key

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Type check (mypy)
        run: mypy app tests

      - name: Test (pytest)
        run: pytest -q
