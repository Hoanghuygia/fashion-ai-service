services:
  app:
    build: .
    env_file:
      - .env.example
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - postgres
      - redis
      - minio

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: style_engine
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin1234
    ports:
      - "127.0.0.1:5433:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin1234
    ports:
      - "127.0.0.1:9002:9000"
      - "127.0.0.1:9003:9001"
